services:
  arangodb:
    image: arangodb:latest
    environment:
      # Authentication is intentionally disabled for local development/testing only.
      # NEVER use ARANGO_NO_AUTH=1 in production.
      ARANGO_NO_AUTH: "1"
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    healthcheck:
      # arangodb:latest is Alpine-based — curl is absent, wget is available.
      # Use 127.0.0.1 explicitly: Alpine's localhost resolves to ::1 (IPv6)
      # but arangod listens only on IPv4 (0.0.0.0:8529).
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8529/_api/version"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  arangodb-init:
    image: arangodb:latest
    depends_on:
      arangodb:
        condition: service_healthy
    volumes:
      - ./docker/init:/docker-init:ro
    command:
      - arangosh
      - --server.endpoint
      - tcp://arangodb:8529
      - --server.authentication
      - "false"
      - --javascript.execute
      - /docker-init/01_setup.js
    restart: "no"

volumes:
  arangodb_data:

# ─────────────────────────────────────────────────────────────
# Connection details for the IntelliJ plugin (local testing):
#   Host     : localhost
#   Port     : 8529
#   User     : root
#   Password : (leave empty)
#   Database : testdb
#
# Start  : docker compose up -d
# Stop   : docker compose down
# Reset  : docker compose down -v   (wipes data, re-runs init on next start)
# Logs   : docker compose logs -f arangodb-init
# ─────────────────────────────────────────────────────────────
