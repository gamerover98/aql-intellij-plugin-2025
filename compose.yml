services:
  arangodb:
    image: arangodb:latest
    environment:
      # Authentication is intentionally disabled for local development/testing only.
      # NEVER use ARANGO_NO_AUTH=1 in production.
      ARANGO_NO_AUTH: "1"
      # The following variables are set to empty strings so the entrypoint script
      # does not attempt to configure a password (ARANGO_NO_AUTH takes precedence).
      ARANGO_ROOT_PASSWORD: ""
      ARANGO_ROOT_PASSWORD_FILE: ""
      ARANGO_RANDOM_ROOT_PASSWORD: ""
    ports:
      - "8529:8529"
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - arangodb_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8529/_api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  arangodb_data:

# ─────────────────────────────────────────────────────────────
# Connection details for the IntelliJ plugin (local testing):
#   Host     : localhost
#   Port     : 8529
#   User     : root
#   Password : (leave empty)
#   Database : testdb
#
# Start  : docker compose up -d
# Stop   : docker compose down
# Reset  : docker compose down -v   (wipes data, re-runs init on next start)
# ─────────────────────────────────────────────────────────────
